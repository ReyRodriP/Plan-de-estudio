<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="../CSS/login.css" />
  <link rel="icon" href="../ASSETS/FC.png" />
</head>
<body>
  <main class="login-container">
    <section class="form-side">
      <form class="login-form" id="loginForm">
        <h2>Iniciar Sesión</h2>
        <p class="form-subtitle">Por favor ingresa tus credenciales</p>

        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Ingresa tu correo"
          required
        />

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          required
        />

        <button type="submit" id="loginBtn">Entrar</button>

        <p class="register-link">
          ¿No tienes cuenta?
          <a href="register.html">Regístrate aquí</a>
        </p>
      </form>
    </section>
    <section class="image-side">
      <div class="overlay-text">
        <h1>Bienvenido de nuevo</h1>
        <p>Accede a tu cuenta y continúa tu progreso académico.</p>
      </div>
    </section>
  </main>
</body>
</html>
