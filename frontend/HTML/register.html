<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/register.css">
    <link rel="icon" href="../ASSETS/FC.png">
    <title>Registro</title>
</head>
<body>
    <main>
        <section class="image">
            <h1>Registrate ahora</h1>
            <p>Podrás dar seguimiento a tu progreso durante toda la carrera que cursas, para una mejor organización.</p>
        </section>

        <section class="formulario">
            <form action="">
                <h2>Registro de usuario</h2>
                <p class="form-subtitle">Por favor ingresa los datos correspondientes</p>

                <label for="">Nombre de Usuario*</label>
                <input 
                type="text" 
                id="userName"
                placeholder="Nombre de Usuario" 
                required>

                <label for="">Matrícula*</label>
                <input 
                type="text" 
                id="studentCode"
                placeholder="Matrícula" 
                required>

                <label for="">Correo Electrónico*</label>
                <input 
                type="email"
                id="email" 
                placeholder="Correo Electrónico" 
                required>

                <label for="">Contraseña*</label>
                <input 
                type="text" 
                id="password"
                placeholder="Contraseña" 
                required>

                <button type="submit" id="register">Registrar</button>

                <p class="login-link">
                ¿Ya estás registrado?
                <a href="/">Inicia sesión aquí</a>
                </p>
            </form>
        </section>  
    </main>
    
    <script src="../JS/register.js"></script>
</body>
</html>
